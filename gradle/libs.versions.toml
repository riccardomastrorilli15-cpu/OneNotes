[versions]
agp = "9.4.1"
kotlin = "2.3.21"
ksp = "2.3.12"
hilt = "2.60.1"
room = "3.0.3"
sqlite = "2.7.1"
coroutines = "1.10.2"
lifecycle = "2.6.2"
datastore = "1.2.1"
oneui = "1.2.6"
appcompat = "1.4.0"
material = "1.5.0"
recyclerview = "1.4.1"
preference = "1.1.0"
junit = "4.13.2"
androidx-test = "1.6.1"
espresso = "3.6.1"
leakcanary = "2.14"
ktlint = "14.2.0"

[libraries]
oneui-design = { module = "io.github.oneuiproject:design", version.ref = "oneui" }
sesl-appcompat = { module = "io.github.oneuiproject.sesl:appcompat", version.ref = "appcompat" }
sesl-material = { module = "io.github.oneuiproject.sesl:material", version.ref = "material" }
sesl-recyclerview = { module = "io.github.oneuiproject.sesl:recyclerview", version.ref = "recyclerview" }
sesl-preference = { module = "io.github.oneuiproject.sesl:preference", version.ref = "preference" }
room-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
datastore = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-junit = { module = "androidx.test.ext:junit", version = "1.2.1" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
leakcanary = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanary" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
