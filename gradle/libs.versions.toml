[versions]
# Android Gradle Plugin + build tools (update AGP and Gradle together:
# AGP 8.9.x requires Gradle 8.11.x and JDK 17).
agp = "8.9.3"

# Kotlin / KSP (KSP version is tied to the Kotlin version).
kotlin = "2.1.10"
ksp = "2.1.10-1.0.30"

# SDK levels.
minSdk = "26"
targetSdk = "35"
compileSdk = "36"

# Jetpack.
#
# NOTE: the One UI (sesl) libraries are forks of appcompat / core / fragment / recyclerview /
# preference / drawerlayout / coordinatorlayout / material and they ship the very same
# packages. The versions below are the ones the sesl forks were built against: keeping them
# aligned avoids "cannot access MenuHost" / duplicate class errors.
room = "2.7.1"
lifecycle = "2.5.1"
fragment = "1.3.6"
activity = "1.2.4"
biometric = "1.1.0"
coroutines = "1.9.0"

# One UI (sesl) libraries - io.github.oneuiproject.
oneuiDesign = "1.2.6"
seslAppcompat = "1.4.0"
seslMaterial = "1.5.0"
seslRecyclerView = "1.4.0"
seslSwipeRefreshLayout = "1.0.0"
seslDrawerLayout = "1.0.0"
seslCoordinatorLayout = "1.0.0"
seslPreference = "1.1.0"
seslPickerBasic = "1.2.0"
seslPickerColor = "1.1.0"

# Misc.
okhttp = "4.12.0"
playServicesAuth = "21.2.0"
mlkitTextRecognition = "16.0.0"

[libraries]
# One UI
oneui-design = { module = "io.github.oneuiproject:design", version.ref = "oneuiDesign" }
sesl-appcompat = { module = "io.github.oneuiproject.sesl:appcompat", version.ref = "seslAppcompat" }
sesl-material = { module = "io.github.oneuiproject.sesl:material", version.ref = "seslMaterial" }
sesl-recyclerview = { module = "io.github.oneuiproject.sesl:recyclerview", version.ref = "seslRecyclerView" }
sesl-swiperefreshlayout = { module = "io.github.oneuiproject.sesl:swiperefreshlayout", version.ref = "seslSwipeRefreshLayout" }
sesl-preference = { module = "io.github.oneuiproject.sesl:preference", version.ref = "seslPreference" }
sesl-drawerlayout = { module = "io.github.oneuiproject.sesl:drawerlayout", version.ref = "seslDrawerLayout" }
sesl-coordinatorlayout = { module = "io.github.oneuiproject.sesl:coordinatorlayout", version.ref = "seslCoordinatorLayout" }

# Jetpack
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# Networking / Google
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
play-services-auth = { module = "com.google.android.gms:play-services-auth", version.ref = "playServicesAuth" }
mlkit-text-recognition = { module = "com.google.mlkit:text-recognition", version.ref = "mlkitTextRecognition" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
