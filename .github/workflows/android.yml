name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android 17 SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v5
      - name: Compile and unit tests
        id: compile
        run: ./scripts/ci_gradle.sh --no-daemon :app:assembleDebug :app:assembleRelease testDebugUnitTest ktlintCheck
      - name: Android lint
        run: ./scripts/ci_gradle.sh --no-daemon :app:lintDebug
      - name: Verify checked-in Room schemas
        if: always() && steps.compile.outcome == 'success'
        run: |
          git diff --exit-code -- core-database/schemas
          test -z "$(git ls-files --others --exclude-standard -- core-database/schemas)"
      - name: Report schemas and lint issues on failure
        if: failure()
        run: |
          python3 scripts/ci_report_schemas.py core-database/schemas
          python3 scripts/ci_report_lint.py .
      - name: Audit packaged fonts and test the audit
        if: always() && steps.compile.outcome == 'success'
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/audit_apk_fonts.py app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/audit_apk_fonts.py app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: debug-apk-for-testing
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

  instrumented-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./scripts/ci_instrumented.sh :core-database:connectedDebugAndroidTest :feature-drawing:connectedDebugAndroidTest :app:connectedDebugAndroidTest
      - name: Report instrumented test results
        if: always()
        run: python3 scripts/ci_report_test_results.py .
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: instrumented-reports
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          if-no-files-found: ignore
