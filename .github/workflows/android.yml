name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android 17 SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v5
      - name: Compile and unit tests
        id: compile
        run: ./scripts/ci_gradle.sh --no-daemon :app:assembleDebug :app:assembleRelease :app:bundleRelease testDebugUnitTest ktlintCheck
      - name: Android lint
        run: ./scripts/ci_gradle.sh --no-daemon :app:lintDebug
      - name: Verify checked-in Room schemas
        if: always() && steps.compile.outcome == 'success'
        run: |
          git diff --exit-code -- core-database/schemas
          test -z "$(git ls-files --others --exclude-standard -- core-database/schemas)"
      - name: Report schemas and lint issues on failure
        if: failure()
        run: |
          python3 scripts/ci_report_schemas.py core-database/schemas
          python3 scripts/ci_report_lint.py .
      - name: Audit packaged fonts and test the audit
        if: always() && steps.compile.outcome == 'success'
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/audit_apk_fonts.py app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/audit_apk_fonts.py app/build/outputs/apk/release/app-release-unsigned.apk
          python3 scripts/audit_apk_fonts.py app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: debug-apk-for-testing
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

  instrumented-tests:
    strategy:
      fail-fast: false
      matrix:
        # Android 17 packages use the major.minor name android-37.0.
        api-level: [26, 29, 35, '37.0']
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902' # 22.0 understands android-37.0 AVD targets
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v5
      - name: Prepare Android 17 emulator image
        if: matrix.api-level == '37.0'
        shell: bash
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/cmdline-tools"
          # emulator-runner prepends latest/bin; ensure it points to the new tools
          # rather than a preinstalled version that writes target=android-0.
          version=''
          if [ -x "$tools/latest/bin/sdkmanager" ]; then
            version=$("$tools/latest/bin/sdkmanager" --version | tr -d '\r' | awk 'NF { line=$0 } END { print line }' || true)
          fi
          if [ "$version" != '22.0' ] && [ -x "$tools/22.0/bin/sdkmanager" ]; then
            if [ -e "$tools/latest" ] || [ -L "$tools/latest" ]; then
              mv "$tools/latest" "$tools/lume-ci-previous-latest"
            fi
            ln -s "$tools/22.0" "$tools/latest"
            version=$("$tools/latest/bin/sdkmanager" --version | tr -d '\r' | awk 'NF { line=$0 } END { print line }')
          fi
          if [ "$version" != '22.0' ]; then
            candidates=$(find "$tools" -maxdepth 3 -name sdkmanager -print 2>/dev/null | tr '\n' ' ' || true)
            echo "::error title=Android 17 tools::Expected 22.0, got '$version'; tools=$tools; candidates=$candidates; PATH tool=$(command -v sdkmanager || true)"
            exit 1
          fi
          set +e
          "$tools/latest/bin/sdkmanager" --install 'system-images;android-37.0;google_apis;x86_64' 2>&1 | tee "$RUNNER_TEMP/android17-sdk.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            python3 scripts/ci_report_failure.py "$RUNNER_TEMP/android17-sdk.log" || true
            exit "$status"
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        # Boot timeout alone does not bound SDK installation or a stuck test run.
        timeout-minutes: 25
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          cores: ${{ matrix.api-level == '37.0' && '4' || '2' }}
          ram-size: ${{ matrix.api-level == '37.0' && '4096M' || '2048M' }}
          emulator-boot-timeout: 900
          emulator-options: ${{ matrix.api-level == '37.0' && '-no-window -gpu software -no-snapshot -noaudio -no-boot-anim' || '-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim' }}
          disable-animations: true
          disable-spellchecker: true
          # Screenshot capture is opt-in and only for this disposable, synthetic-data emulator.
          script: ./scripts/ci_instrumented.sh -Pandroid.testInstrumentationRunnerArguments.captureScreenshots=1 :core-database:connectedDebugAndroidTest :feature-drawing:connectedDebugAndroidTest :app:connectedDebugAndroidTest
      - name: Report instrumented test results
        if: always()
        run: python3 scripts/ci_report_test_results.py .
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: instrumented-reports-api-${{ matrix.api-level }}
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          if-no-files-found: ignore
